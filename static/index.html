<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Duck Debugger — Python 101</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
  #log { border: 1px solid #ccc; border-radius: 8px; padding: 12px; height: 420px; overflow-y: auto; margin-bottom: 12px; background: #fafafa; }
  .msg { margin-bottom: 16px; white-space: pre-wrap; word-wrap: break-word; line-height: 1.5; font-size: 14px; }
  .user { color: #1a4b8c; font-weight: 500; }
  .assistant { color: #333; background: #fff; padding: 10px; border-left: 3px solid #2563eb; border-radius: 4px; }
  textarea { width: 100%; height: 90px; box-sizing: border-box; }
  #gate { margin-bottom: 20px; }
  button { margin-top: 8px; padding: 8px 16px; cursor: pointer; }
</style>
</head>
<body>
<h2>🦆 Duck Debugger — Python 101</h2>
<p>Décrivez votre bug ou collez votre code + le message d'erreur. Le canard ne vous donnera jamais la solution directement — il vous aidera à la trouver.</p>

<div id="gate">
  <label>Mot de passe de classe : <input id="password" type="password"></label>
  <button onclick="unlock()">Entrer</button>
</div>

<div id="chatbox" style="display:none">
  <div id="log"></div>
  <textarea id="input" placeholder="Décrivez votre problème..."></textarea>
  <button onclick="send()">Envoyer</button>
</div>

<script>
let password = "";
let sessionId = crypto.randomUUID();
let history = [];

function unlock() {
  password = document.getElementById("password").value;
  document.getElementById("gate").style.display = "none";
  document.getElementById("chatbox").style.display = "block";
}

async function send() {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  appendMessage("user", text);
  history.push({ role: "user", content: text });

  // Create a message div for the assistant's streaming response
  const log = document.getElementById("log");
  const assistantDiv = document.createElement("div");
  assistantDiv.className = "msg assistant";
  assistantDiv.textContent = "🦆 : ";
  log.appendChild(assistantDiv);
  log.scrollTop = log.scrollHeight;

  let fullResponse = "";
  let hasError = false;

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password, session_id: sessionId, history }),
    });

    if (!res.ok) {
      const err = await res.json();
      assistantDiv.textContent = "🦆 : ⚠️ " + (err.detail || "Erreur serveur");
      hasError = true;
      return;
    }

    // Read the streaming response
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop() || "";

      for (const line of lines) {
        if (line.startsWith("data: ")) {
          const content = line.slice(6);

          if (content === "[DONE]") {
            // Stream finished
            break;
          } else if (content.startsWith("[ERROR]")) {
            assistantDiv.textContent += "\n⚠️ " + content.slice(7);
            hasError = true;
            break;
          } else if (content) {
            // Append streamed content
            fullResponse += content;
            assistantDiv.textContent = "🦆 : " + fullResponse;
            log.scrollTop = log.scrollHeight;
          }
        }
      }
    }

    // Add to history only if successful
    if (!hasError && fullResponse) {
      history.push({ role: "assistant", content: fullResponse });
    }

  } catch (err) {
    assistantDiv.textContent = "🦆 : ⚠️ Erreur de connexion: " + err.message;
  }
}

function appendMessage(role, content) {
  const log = document.getElementById("log");
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = (role === "user" ? "Vous : " : "🦆 : ") + content;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}
</script>
</body>
</html>
